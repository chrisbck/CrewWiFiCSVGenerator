<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wi-Fi Crew CSV Generator</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    textarea { width: 100%; height: 150px; font-family: monospace; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    button { margin-top: 1rem; margin-right: 0.5rem; padding: 0.5rem 1rem; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .duplicate { background-color: #ffe0e0; }
    #skippedWarning {
      display: none; margin-top: 1rem; padding: 0.5rem 1rem;
      background: #fff4d6; border: 1px solid #e0b84a;
    }
    #skippedWarning pre { margin: 0.3rem 0 0; white-space: pre-wrap; }

    #printSheet { display: none; }

    @media print {
      body > *:not(#printSheet) { display: none !important; }
      #printSheet {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        gap: 0.4rem;
      }
      .slip {
        border: 1px dashed #999;
        padding: 0.5rem 0.7rem;
        break-inside: avoid;
        page-break-inside: avoid;
        font-family: sans-serif;
        font-size: 0.85rem;
      }
      .slip div { margin: 0.15rem 0; }
      .slip .label { font-weight: bold; }
    }
  </style>
</head>
<body>
  <h1>Wi-Fi Crew CSV Generator</h1>

  <p>Paste names and positions (tab-separated or spaced, e.g. from Excel):</p>
  <textarea id="inputArea" placeholder="e.g.
Bob Dylan	Welder
Kylie Minogue	Roustabout"></textarea>

  <p>
    <label for="planSelect">Plan:</label>
    <select id="planSelect">
      <option selected>Regular Crew 28Days</option>
      <option>VTG starlink time based 30 GB plan</option>
    </select>
  </p>

  <div>
    <button onclick="processInput()">Generate Table</button>
    <button id="downloadBtn" onclick="downloadCSV()" disabled>Download CSV</button>
    <button id="printBtn" onclick="printCredentials()" disabled>Print Credentials</button>
    <button onclick="window.open('https://10.105.2.93/admin/index-login.ant', '_blank')">IG4 Login</button>
  </div>

  <div id="skippedWarning"></div>

  <table id="previewTable" style="display: none">
    <thead>
      <tr><th>Name</th><th>Position</th><th>Username</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="printSheet"></div>

  <script>
    // Enable Tab character insertion in textarea
    const inputArea = document.getElementById('inputArea');
    inputArea.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + '\t' + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 1;
      }
    });

    let processedData = [];
    const downloadBtn = document.getElementById('downloadBtn');
    const printBtn = document.getElementById('printBtn');

    inputArea.addEventListener('input', () => {
      downloadBtn.disabled = true;
      printBtn.disabled = true;
    });

    function generateUsername(fullName) {
      const sanitized = fullName.replace(/[^a-zA-Z0-9. ]+/g, '');
      const parts = sanitized.trim().split(/\s+/);
      if (parts.length === 0) return "user";
      const initials = parts.slice(0, -1).map(p => p[0].toUpperCase()).join("_");
      const last = parts[parts.length - 1];
      const lastCap = last.charAt(0).toUpperCase() + last.slice(1).toLowerCase();
      return (initials ? initials + "_" : "") + lastCap;
    }

    function processInput() {
      const rows = inputArea.value.trim().split(/\n/);
      processedData = [];
      const tbody = document.querySelector("#previewTable tbody");
      tbody.innerHTML = "";
      const seenUsernames = new Set();
      const skipped = [];
      rows.forEach((row, i) => {
        if (!row.trim()) return; // blank lines are fine to ignore
        const parts = row.trim().split(/\s{2,}|\t+/);
        const name = parts[0];
        const position = parts.slice(1).join(' ');
        if (!name || !position) {
          skipped.push(`Line ${i + 1}: ${row.trim()}`);
          return;
        }
        let username = generateUsername(name);
        const original = username;
        let counter = 1;
        while (seenUsernames.has(username)) {
          username = `${original}${counter}`;
          counter++;
        }
        seenUsernames.add(username);
        const password = makePassword(7);
        processedData.push({ name, position, username, password });
        const tr = document.createElement("tr");
        tr.className = (username !== original) ? "duplicate" : "";
        [name, position, username].forEach(text => {
          const td = document.createElement("td");
          td.textContent = text;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      const warning = document.getElementById("skippedWarning");
      if (skipped.length) {
        warning.innerHTML = `<strong>${skipped.length} line(s) skipped — no position found.</strong>
          Separate name and position with a tab or at least two spaces.<pre></pre>`;
        warning.querySelector("pre").textContent = skipped.join('\n');
        warning.style.display = "block";
      } else {
        warning.style.display = "none";
      }

      const hasRows = processedData.length > 0;
      document.getElementById("previewTable").style.display = hasRows ? "table" : "none";
      downloadBtn.disabled = !hasRows;
      printBtn.disabled = !hasRows;
    }

    // CSV field: wrap in quotes and double any embedded quotes (RFC 4180)
    function quote(str) { return `"${String(str).replace(/"/g, '""')}"`; }

    function formatDateAMPM(date) {
      const d = date.getDate().toString().padStart(2, '0');
      const m = (date.getMonth()+1).toString().padStart(2, '0');
      const y = date.getFullYear();
      let h = date.getHours();
      const min = date.getMinutes().toString().padStart(2, '0');
      const ap = h >= 12 ? 'PM':'AM';
      h = h % 12 || 12;
      return `${d}/${m}/${y} ${h.toString().padStart(2,'0')}:${min}${ap}`;
    }

    function downloadCSV() {
      if (!processedData.length) return;
      const now = new Date();
      const dateStr = formatDateAMPM(now);
      const dateCode = now.toISOString().split('T')[0];
      const fileName = `crew_accounts_${dateCode}.csv`;
      const header = ["Enabled","User ID","Password","Access Code","Plan","Valid From","To","Share",
        "Billing ID","Zones","Description","Creator","Date","Daily Limit",
        "Limit logins to the selected days and time","Daily Start Time","Daily End Time",
        "Device Restriction","Restricted MAC Address"];
      const lines = [header.map(quote).join(',')];
      const plan = document.getElementById('planSelect').value;
      processedData.forEach(({name,position,username,password}) => {
        const row = ["yes",username,password,'',plan,dateStr,'','', '',"2",position,'admin',dateStr,'off','','00:00:00','00:00:00','off',''];
        lines.push(row.map(quote).join(','));
      });
      const blob = new Blob([lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = fileName; a.click(); URL.revokeObjectURL(a.href);
    }

    function buildPrintSheet() {
      const sheet = document.getElementById("printSheet");
      sheet.innerHTML = "";
      processedData.forEach(({position,username,password}) => {
        const slip = document.createElement("div");
        slip.className = "slip";
        [["Username", username], ["Password", password], ["Position", position]].forEach(([label, value]) => {
          const line = document.createElement("div");
          const span = document.createElement("span");
          span.className = "label";
          span.textContent = label + ":";
          line.append(span, " " + value);
          slip.appendChild(line);
        });
        sheet.appendChild(slip);
      });
    }

    function printCredentials() {
      if (!processedData.length) return;
      buildPrintSheet();
      window.print();
    }

    // Excludes characters easily confused on a printed slip: l I 1 O o 0
    const PASSWORD_CHARS = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    function makePassword(len) {
      const cs = PASSWORD_CHARS;
      // Rejection sampling over crypto random bytes to avoid modulo bias
      const limit = 256 - (256 % cs.length);
      let out = "";
      while (out.length < len) {
        const bytes = crypto.getRandomValues(new Uint8Array(len * 2));
        for (const b of bytes) {
          if (b < limit && out.length < len) out += cs[b % cs.length];
        }
      }
      return out;
    }
  </script>
</body>
</html>
